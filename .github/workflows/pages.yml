name: Deploy dashboard Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_run:
    workflows: ["Collect dashboard data (PAT)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate static snapshot
        run: |
          test -s site/index.html
          test -s site/data/snapshot.json
      # Unexpired E2E HTML reports come from the collect runs that fetched them;
      # anything unavailable falls back to its GitHub artifact link.
      - name: Attach E2E HTML reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 run_records.py attach site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
